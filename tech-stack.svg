<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Mohd Aquib Tech Stack">
<title>Tech Stack</title>
<desc>Tech icons orbiting a React-style atom, and grouped grid of Frontend, Programming, Libraries, Tools, and AI.</desc>
<defs>
<style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Courier New', Consolas, Monaco, monospace; font-weight: bold; }
    
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    
    .fu { animation: fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both; }
    .chip { animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
    .core { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    
    .chip-bg { fill: #141810; stroke: #2a3319; stroke-width: 1.5; transition: stroke 0.3s ease; }
    .cat-title { font-size: 13px; fill: #a0a0a0; letter-spacing: 2px; }
    .chip-text { font-size: 14px; fill: #eceef6; font-weight: 600; }
    .icon-color { fill: #8FBC8F; }
</style>

<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0c0a"/>
    <stop offset="1" stop-color="#050605"/>
</linearGradient>

<linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#556B2F"/>
    <stop offset=".5" stop-color="#111611"/>
    <stop offset="1" stop-color="#8FBC8F"/>
</linearGradient>

<radialGradient id="coreG" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#8FBC8F"/>
    <stop offset=".5" stop-color="#556B2F"/>
    <stop offset="1" stop-color="#2a3319"/>
</radialGradient>

<radialGradient id="halo">
    <stop offset="0" stop-color="#556B2F" stop-opacity=".25"/>
    <stop offset="1" stop-color="#556B2F" stop-opacity="0"/>
</radialGradient>

<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1.2" fill="#1f2617"/>
</pattern>
</defs>

<!-- Background -->
<rect width="1280" height="480" rx="24" fill="url(#bg)"/>
<rect width="1280" height="480" rx="24" fill="url(#dots)"/>
<rect x="1" y="1" width="1278" height="478" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

<!-- Header -->
<g class="fu" style="animation-delay:.1s">
    <text class="mono" x="50" y="60" font-size="14" fill="#8FBC8F" letter-spacing="2">// TECH STACK</text>
    <text x="50" y="100" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Tools I build with</text>
</g>

<!-- Divider Line -->
<line x1="460" y1="40" x2="460" y2="440" stroke="#2a3319" stroke-width="1.5"/>

<!-- Left Side: Orbiting Atom Animation -->
<g transform="translate(250, 270)">
    <!-- Halo glow -->
    <circle r="130" fill="url(#halo)"/>
    
    <!-- Orbits -->
    <ellipse rx="160" ry="60" fill="none" stroke="#556B2F" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    <ellipse rx="160" ry="60" fill="none" stroke="#556B2F" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(60)"/>
    <ellipse rx="160" ry="60" fill="none" stroke="#556B2F" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" transform="rotate(120)"/>

    <!-- Orbiting Electrons -->
    <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        <circle cx="160" cy="0" r="10" fill="#0a0c0a" stroke="#8FBC8F" stroke-width="2.5"/>
    </g>
    <g transform="rotate(60)">
        <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
            <circle cx="160" cy="0" r="10" fill="#0a0c0a" stroke="#ffffff" stroke-width="2.5"/>
        </g>
    </g>
    <g transform="rotate(120)">
        <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
            <circle cx="160" cy="0" r="10" fill="#0a0c0a" stroke="#556B2F" stroke-width="2.5"/>
        </g>
    </g>

    <!-- Center Core -->
    <g class="core">
        <circle r="48" fill="url(#coreG)"/>
        <text y="9" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" class="mono">&lt;/&gt;</text>
    </g>
</g>

<!-- ================= RIGHT SIDE: TECH GRID ================= -->

<!-- COLUMN 1 (x=500) -->
<g transform="translate(500, 0)">
    
    <!-- FRONTEND -->
    <text y="50" class="mono cat-title" style="animation-delay: 0.3s">FRONTEND</text>
    
    <g transform="translate(0, 65)">
        <g class="chip" style="animation-delay: 0.4s">
            <rect width="95" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M2 2h20l-1.8 20L12 24l-8.2-2L2 2zm6.6 9.4l-.2-2.5h7.4l.2-2.5H6.2l.6 7.6h8.7l-.3 3.2-3.2.9-3.2-.9-.2-1.9H6l.3 3.9 5.7 1.6 5.7-1.6.7-7.8H8.6z"/>
            </g>
            <text x="42" y="26" class="chip-text">HTML5</text>
        </g>
    </g>
    
    <g transform="translate(105, 65)">
        <g class="chip" style="animation-delay: 0.5s">
            <rect width="90" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M2 2h20l-1.8 20L12 24l-8.2-2L2 2zm14.4 6.5l.2-2.5H6.2l.2 2.5h10.2l-.2 1.9H6.5l.2 2.5h9.4l-.3 3.2-3.8 1.1-3.8-1.1-.2-1.9H5.9l.3 4 6 1.7 6-1.7.8-8.7H7.1l-.2-1.9h10.9z"/>
            </g>
            <text x="42" y="26" class="chip-text">CSS3</text>
        </g>
    </g>

    <g transform="translate(205, 65)">
        <g class="chip" style="animation-delay: 0.6s">
            <rect width="135" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M3 3h18v18H3V3zm10 13.5c0 1.5-1 2.5-2.5 2.5-1.2 0-2.2-.8-2.5-1.8l1.5-1c.2.5.5.9 1 .9.4 0 .7-.2.7-.6 0-.4-.3-.6-1.1-.9-1.2-.4-2-.9-2-2.1 0-1.1.9-2.1 2.2-2.1 1.2 0 2 .7 2.3 1.5l-1.4 1c-.1-.4-.4-.7-.8-.7-.4 0-.6.2-.6.5 0 .3.2.5 1 .8 1.3.5 2.2 1.2 2.2 2.5zm5.5 2.2c-1 .6-2.2.4-2.8-.5V10h1.8v5.5c0 .6.3 1 .8 1 .4 0 .8-.2 1-.5V10h1.8v8.2z"/>
            </g>
            <text x="42" y="26" class="chip-text">JavaScript</text>
        </g>
    </g>

    <!-- PROGRAMMING LANGUAGES -->
    <text y="140" class="mono cat-title" style="animation-delay: 0.7s">PROGRAMMING LANGUAGES</text>

    <g transform="translate(0, 155)">
        <g class="chip" style="animation-delay: 0.8s">
            <rect width="90" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M16 2c-.6 0-1.2.4-1.5 1-.2.6.2 1.3.8 1.6.8.3 1.2 1.1 1.1 1.9-.2.8-1 1.3-1.8 1.2-.5-.1-1-.4-1.2-.8-.2-.4-.6-.7-1-.5-.4.2-.6.7-.5 1 .4 1 1.3 1.7 2.3 1.9h-6.8C6.3 9.3 5.5 10 5.5 11v2.2c0 2.5 2 4.5 4.5 4.5h3.5c2.5 0 4.5-2 4.5-4.5V11c0-.5-.4-.8-.8-.8h-1c.3-.6.5-1.1.5-1.8.3-1.3-.4-2.7-1.7-3.2-1.3-.5-2-1.8-1.6-3 .3-.9 1.1-1.5 2.2-1.5.5 0 .9-.4.9-.8s-.4-.8-.9-.8zm-4 17.5c-3.2 0-5.8.8-5.8 1.8s2.6 1.8 5.8 1.8 5.8-.8 5.8-1.8-2.6-1.8-5.8-1.8zM7.2 11h9.2c.2 0 .3.1.3.3v2c0 1.5-1.2 2.8-2.8 2.8H10c-1.5 0-2.8-1.2-2.8-2.8v-2c0-.2.1-.3.3-.3zm10 .2v1c0 .9-.5 1.8-1.2 2.3h1.2c1.5 0 2.8-1.2 2.8-2.8v-.8c0-.3-.3-.6-.6-.6h-2.2z"/>
            </g>
            <text x="42" y="26" class="chip-text">Java</text>
        </g>
    </g>

    <g transform="translate(100, 155)">
        <g class="chip" style="animation-delay: 0.9s">
            <rect width="105" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M12 2c-2.6 0-4.6 2-4.6 4.6v2.2h4.7v1.1H3.6C1.6 9.9 0 11.4 0 13.5c0 2 1.6 3.6 3.6 3.6h2.2v-2.4c0-1.8 1.5-3.3 3.3-3.3h4.8V6.8c0-2.7-2.1-4.8-4.5-4.8zM9.8 4.2c.6 0 1.1.5 1.1 1.1s-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1.5-1.1 1.1-1.1zm8.6 1.8v2.4c0 1.8-1.5 3.3-3.3 3.3H10.3v4.6c0 2.7 2.1 4.8 4.8 4.8 2.6 0 4.6-2 4.6-4.6v-2.2h-4.7v-1.1h8.5c2 0 3.6-1.5 3.6-3.6 0-2-1.6-3.6-3.6-3.6h-2.2zM14.2 17.6c.6 0 1.1.5 1.1 1.1s-.5 1.1-1.1 1.1-1.1-.5-1.1-1.1.5-1.1 1.1-1.1z"/>
            </g>
            <text x="42" y="26" class="chip-text">Python</text>
        </g>
    </g>

    <g transform="translate(215, 155)">
        <g class="chip" style="animation-delay: 1.0s">
            <rect width="75" height="42" rx="12" class="chip-bg"/>
            <text x="37.5" y="26" class="chip-text" text-anchor="middle">C#</text>
        </g>
    </g>

    <g transform="translate(0, 205)">
        <g class="chip" style="animation-delay: 1.1s">
            <rect width="190" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M13 2L3 13h7l-2 9 11-12h-7z"/>
            </g>
            <text x="42" y="26" class="chip-text">Rapid Programming</text>
        </g>
    </g>

    <!-- LIBRARIES -->
    <text y="280" class="mono cat-title" style="animation-delay: 1.2s">LIBRARIES</text>

    <g transform="translate(0, 295)">
        <g class="chip" style="animation-delay: 1.3s">
            <rect width="105" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M4 4h4v16H4zm8 0h4v16h-4z"/>
            </g>
            <text x="42" y="26" class="chip-text">NumPy</text>
        </g>
    </g>

    <g transform="translate(115, 295)">
        <g class="chip" style="animation-delay: 1.4s">
            <rect width="110" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <circle cx="12" cy="12" r="8" fill="none" stroke="#8FBC8F" stroke-width="3"/>
                <circle cx="12" cy="12" r="3" fill="#8FBC8F"/>
            </g>
            <text x="42" y="26" class="chip-text">Pandas</text>
        </g>
    </g>

</g>


<!-- COLUMN 2 (x=880) -->
<g transform="translate(880, 0)">
    
    <!-- TOOLS -->
    <text y="50" class="mono cat-title" style="animation-delay: 0.4s">TOOLS</text>

    <g transform="translate(0, 65)">
        <g class="chip" style="animation-delay: 0.5s">
            <rect width="95" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M3 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2H3zm7.3 14l-2-3.6-2.2 3.6H4l3.3-4.9L4.2 6.5h2.1l1.9 3.1 2-3.1h1.8l-3.2 4.7 3.3 4.8h-1.8zm4.7 0v-1.6h4V14.4h-4zm0-2.8v-1.6h4v1.6h-4zm0-2.8V9h4v1.6h-4z"/>
            </g>
            <text x="42" y="26" class="chip-text">Excel</text>
        </g>
    </g>

    <g transform="translate(105, 65)">
        <g class="chip" style="animation-delay: 0.6s">
            <rect width="115" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M4 14h4v6H4zm6-5h4v11h-4zm6-5h4v16h-4z"/>
            </g>
            <text x="42" y="26" class="chip-text">PowerBI</text>
        </g>
    </g>

    <g transform="translate(230, 65)">
        <g class="chip" style="animation-delay: 0.7s">
            <rect width="90" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M3 2c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2H3zm11.3 14l-2-6.4h-1.7l-1 3.8-1.1-3.8H6.8l-2 6.4h1.7l1-4 1.2 4h1.7l1.2-4 1 4h1.8z"/>
            </g>
            <text x="42" y="26" class="chip-text">Word</text>
        </g>
    </g>

    <g transform="translate(0, 115)">
        <g class="chip" style="animation-delay: 0.8s">
            <rect width="80" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M12 3c-5 0-9 1.8-9 4s4 4 9 4 9-1.8 9-4-4-4-9-4zm0 8.5c-4 0-7.4-1.2-8.5-2.9v2.9c0 2.2 4 4 8.5 4s8.5-1.8 8.5-4V8.6c-1.1 1.7-4.5 2.9-8.5 2.9zm0 5.5c-4 0-7.4-1.2-8.5-2.9v2.9c0 2.2 4 4 8.5 4s8.5-1.8 8.5-4v-2.9c-1.1 1.7-4.5 2.9-8.5 2.9z"/>
            </g>
            <text x="42" y="26" class="chip-text">SQL</text>
        </g>
    </g>

    <g transform="translate(90, 115)">
        <g class="chip" style="animation-delay: 0.9s">
            <rect width="75" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M10.8 1.2L1.2 10.8c-.5.5-.5 1.4 0 1.9l8 8c.5.5 1.4.5 1.9 0l9.6-9.6c.5-.5.5-1.4 0-1.9L12.7 1.2c-.5-.5-1.4-.5-1.9 0zm1 3.4c.9 0 1.6.7 1.6 1.6 0 .4-.2.9-.4 1.1l2.5 2.5c.3-.1.5-.1.8-.1.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6-1.6-.7-1.6-1.6c0-.4.1-.6.3-.9l-2.2-2.2v4c.3.2.6.6.6 1 0 .9-.7 1.6-1.6 1.6s-1.6-.7-1.6-1.6c0-.5.3-.9.6-1V8.8c-.3-.2-.6-.6-.6-1 0-.9.7-1.6 1.6-1.6z"/>
            </g>
            <text x="42" y="26" class="chip-text">Git</text>
        </g>
    </g>

    <!-- AI & WORKFLOW -->
    <text y="195" class="mono cat-title" style="animation-delay: 1.0s">AI &amp; WORKFLOW</text>

    <g transform="translate(0, 210)">
        <g class="chip" style="animation-delay: 1.1s">
            <rect width="105" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M12 0l1.6 7.4L21 9l-7.4 1.6L12 18l-1.6-7.4L3 9l7.4-1.6L12 0zm7.5 13.5l-.8 2.2-2.2.8 2.2.8.8 2.2.8-2.2 2.2-.8-2.2-.8-.8-2.2z"/>
            </g>
            <text x="42" y="26" class="chip-text">Gemini</text>
        </g>
    </g>

    <g transform="translate(115, 210)">
        <g class="chip" style="animation-delay: 1.2s">
            <rect width="105" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 17c-3.9 0-7-3.1-7-7s3.1-7 7-7 7 3.1 7 7-3.1 7-7 7zm-2-10v6h4v-6h-4z"/>
            </g>
            <text x="42" y="26" class="chip-text">Claude</text>
        </g>
    </g>

    <g transform="translate(230, 210)">
        <g class="chip" style="animation-delay: 1.3s">
            <rect width="100" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M3 3h8v5H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 10h8v5H3z"/>
            </g>
            <text x="42" y="26" class="chip-text">Replit</text>
        </g>
    </g>

    <g transform="translate(0, 260)">
        <g class="chip" style="animation-delay: 1.4s">
            <rect width="145" height="42" rx="12" class="chip-bg"/>
            <g transform="translate(12, 9)">
                <path class="icon-color" d="M19 3L16 6l-2.5-2.5L16 1l3 2zm-4 4L12 9.5 2 19.5l3 3 9.5-10 2.5-2.5-2-3z"/>
            </g>
            <text x="42" y="26" class="chip-text">AI Prompting</text>
        </g>
    </g>

